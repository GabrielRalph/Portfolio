<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <script type="module" src="./component2.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      /* padding: 40px 16px; */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 100vh;
      background: #ff7b1d;
    }

    design-carousel {
      width: 100%;
      /* height: 100vh; */
      min-height: 100vh;
      padding: 2em 0;
      background: white;
      --img-width: min(100%, 60vh);
      --img-space: 2rem;
      --vertical-spacing: 1rem;
    }

    @media (max-width: 450px) {
        design-carousel {
          --img-width: 100%;
          --text-width: calc(100% - 2rem);
        }
    }

  </style>
</head>
<body>

  <design-carousel data-src="./coffee-table.yaml"></design-carousel>
  <design-carousel data-src="./poissons-buttons.yaml"></design-carousel>

</body>
</html>
